_schema-version: 3.3.0
ID: CAP_APP
version: 1.0.0
description: Karthick CAP
parameters:
  enable-parallel-deployments: true
  deploy_mode: html5-repo
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production
modules:
  - name: CAP_APP-srv
    type: nodejs
    path: gen/srv
    parameters:
      buildpack: nodejs_buildpack
      readiness-health-check-type: http
      readiness-health-check-http-endpoint: /health
    build-parameters:
      builder: npm
    provides:
      - name: srv-api
        properties:
          srv-url: '${default-url}'
    requires:
      - name: CAP_APP-auth
      - name: CAP_APP-db
  - name: CAP_APP-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
    requires:
      - name: CAP_APP-db
  - name: CAP_APP
    type: approuter.nodejs
    path: app/router
    parameters:
      keep-existing-routes: true
      disk-quota: 1024M
      memory: 512M
    requires:
      - name: srv-api
        group: destinations
        properties:
          name: srv-api
          url: '~{srv-url}'
          forwardAuthToken: true
      - name: CAP_APP-auth
      - name: CAP_APP-html5-runtime
  - name: CAP_APP-app-deployer
    type: com.sap.application.content
    path: gen
    requires:
      - name: CAP_APP-html5-repo-host
        parameters:
          content-target: true
    build-parameters:
      build-result: app/
      requires:
        - name: CAP_APPadminbooks
          artifacts:
            - admin-books.zip
          target-path: app/
        - name: CAP_APPbrowse
          artifacts:
            - browse.zip
          target-path: app/
  - name: CAP_APPadminbooks
    type: html5
    path: app/admin-books
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm ci
        - npm run build
      supported-platforms: []
  - name: CAP_APPbrowse
    type: html5
    path: app/browse
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm ci
        - npm run build
      supported-platforms: []
  - name: CAP_APP-portal-deployer
    type: com.sap.application.content
    path: app/portal
    requires:
      - name: CAP_APP-portal
        parameters:
          content-target: true
          service-key:
            name: CAP_APP-portal-key
            config:
              content-endpoint: developer
      - name: CAP_APP-auth
      - name: CAP_APP-html5-repo-host
      - name: CAP_APP-app-deployer
    deployed-after:
      - CAP_APP-app-deployer
resources:
  - name: CAP_APP-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: 'CAP_APP-${org}-${space}'
        tenant-mode: dedicated
  - name: CAP_APP-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
  - name: CAP_APP-connectivity
    type: org.cloudfoundry.managed-service
    parameters:
      service: connectivity
      service-plan: lite
  - name: CAP_APP-html5-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host
  - name: CAP_APP-html5-runtime
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-runtime
  - name: CAP_APP-portal
    type: org.cloudfoundry.managed-service
    parameters:
      service: portal
      service-plan: free
provider: karthick
